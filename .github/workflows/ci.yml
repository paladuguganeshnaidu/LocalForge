name: Extension checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Unit and integration tests
        shell: bash
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/test.log
          node scripts/generate-current-reports.cjs artifacts/test.log
      - name: Hardening corpus
        run: npm run test:hardening
      - name: Package
        run: npm run package
      - name: Package verification
        run: node scripts/verify-marketplace-package.cjs
      - name: Extension Host
        run: npm run test:extension-host
        env:
          CI: true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            artifacts/**
            docs/test-results/CURRENT_*.md
            *.vsix
          if-no-files-found: warn

  source-archive:
    name: Source archive
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output=LOMVREN-hardening-${GITHUB_SHA}.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: LOMVREN-hardening-source
          path: LOMVREN-hardening-${{ github.sha }}.zip
